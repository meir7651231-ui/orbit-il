<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חנות הפתרונות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@700;800&display=swap">
<style>
/* layout: store in the Orbit visual language (single deliberate dark space theme): radial night background with stars, glass cards with blue glow, Frank Ruhl headings with gradient emphasis, Heebo body, gradient primary buttons */
:root {
  --night-1: #1a2340; --night-2: #0d1120; --night-3: #070a12;
  --ink: #eef1fb; --muted: rgba(238,241,251,.62); --faint: rgba(238,241,251,.56);
  --glass: rgba(255,255,255,.035); --glass-2: rgba(255,255,255,.05); --line: rgba(255,255,255,.12); --line-2: rgba(255,255,255,.18);
  --card-bg: linear-gradient(rgba(22,24,38,.82), rgba(11,12,20,.9));
  --blue: #6ea8fe; --blue-2: #8fa8ff; --blue-soft: rgba(110,168,254,.18); --blue-glow: rgba(110,168,254,.24);
  --btn: linear-gradient(#7d9bff, #5570ff);
  --ok: #7ee2a6; --ok-soft: rgba(70,200,120,.14); --soon: #f3c66b; --soon-soft: rgba(240,180,60,.14);
  --display: "Frank Ruhl Libre", David, "Noto Serif Hebrew", serif;
  --body: "Heebo", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night-3); scroll-padding-top: 150px; }
body { color: var(--ink); font: 15.5px/1.6 var(--body); direction: rtl; background: radial-gradient(125% 100% at 72% 6%, var(--night-1) 0%, var(--night-2) 46%, var(--night-3) 100%) fixed; min-height: 100vh; margin: 0; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
main { position: relative; z-index: 1; }
#layer { position: relative; z-index: 50; }
button { font: inherit; color: inherit; }
svg { display: block; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1180px; margin: 0 auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night-2); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(9,11,20,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top .inner { display: flex; align-items: center; gap: 14px; padding-block: 12px 8px; }
.brand { background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; flex: none; }
.mark { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(150deg, rgba(110,168,254,.3), rgba(110,168,254,.13)); border: 1px solid rgba(110,168,254,.36); box-shadow: 0 10px 34px -10px rgba(110,168,254,.6), inset 0 1px 0 rgba(255,255,255,.28); color: #fff; }
.brand span.bt { display: grid; text-align: right; line-height: 1.1; }
.brand b { font: 700 20px var(--display); white-space: nowrap; }
.brand small { font-size: 10.5px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
.search { flex: 1; min-width: 0; position: relative; }
.search svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search input { width: 100%; font: 15px var(--body); padding: 11px 42px 11px 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--glass-2); color: var(--ink); }
.search input::placeholder { color: var(--faint); }
.search input:focus-visible { outline: none; border-color: rgba(110,168,254,.6); box-shadow: 0 0 0 3px rgba(110,168,254,.18); }
.basket { flex: none; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(110,168,254,.5); background: var(--btn); color: #fff; border-radius: 13px; padding: 9px 14px; cursor: pointer; font-weight: 700; box-shadow: 0 12px 30px -14px rgba(110,168,254,.72), inset 0 1px 0 rgba(255,255,255,.35); }
.basket i { font-style: normal; background: rgba(255,255,255,.22); border-radius: 999px; min-width: 22px; height: 22px; display: grid; place-items: center; font-size: 12px; font-weight: 700; padding: 0 6px; }
.rail { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 8px; scroll-behavior: smooth; }
.railw { position: relative; }
.railw.fs::before, .railw.fe::after { content: ""; position: absolute; top: 0; bottom: 8px; width: 46px; pointer-events: none; z-index: 1; }
.railw.fs::before { right: 0; background: linear-gradient(to left, rgba(9,11,20,.95), transparent); }
.railw.fe::after { left: 0; background: linear-gradient(to right, rgba(9,11,20,.95), transparent); }
.rarr { position: absolute; top: 2px; z-index: 2; width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: rgba(20,24,40,.95); color: var(--ink); cursor: pointer; display: none; place-items: center; font-size: 16px; line-height: 1; }
.railw.fe .rail { padding-left: 36px; } .railw.fs .rail { padding-right: 36px; }
@media (hover: none) { .railw .rail { padding-inline: 0; } }
.railw.fs .rarr.rs { display: grid; right: 0; } .railw.fe .rarr.re { display: grid; left: 0; }
@media (hover: none) { .rarr { display: none !important; } }
.rail button { flex: none; border: 0; background: none; padding: 6px 11px; border-radius: 10px; cursor: pointer; font-size: 13.5px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.rail button:hover { color: var(--ink); background: var(--glass-2); }
.rail button[aria-current="true"] { color: #fff; background: linear-gradient(rgba(110,168,254,.32), rgba(110,168,254,.18)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); font-weight: 600; }
.basket .bi2 { display: none; }
@media (max-width: 620px) { .brand span.bt { display: none; } .basket span { display: none; } .basket .bi2 { display: block; } .basket { padding: 9px 10px; } }
main .inner { display: grid; gap: 60px; padding-block: 30px 90px; }
main .inner > * { min-width: 0; }
h1, h2, h3 { margin: 0; }
h2 { font: 700 clamp(25px, 3.4vw, 34px)/1.2 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.grad { background: linear-gradient(100deg, var(--blue-2), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.eyebrow { font-size: 11.5px; font-weight: 500; letter-spacing: .14em; color: var(--muted); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.sec-head p { margin: 4px 0 0; color: var(--muted); }
.textlink { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font-weight: 600; font-size: 14.5px; }
.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 30px; align-items: center; min-height: 460px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; min-height: 0; } .hero .stack { display: none; } }
.hero h1 { font: 700 clamp(36px, 6vw, 64px)/1.06 var(--display); letter-spacing: -.008em; text-wrap: balance; color: #fff; }
.hero h1 em { font-style: normal; font-weight: 800; background: linear-gradient(100deg, var(--blue-2), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lede { font-size: clamp(16px, 1.9vw, 19px); color: var(--muted); margin: 16px 0 24px; max-width: 46ch; }
.ask { font-weight: 600; margin-bottom: 10px; color: var(--ink); }
.needs { display: flex; flex-wrap: wrap; gap: 8px; }
.need { border: 1px solid var(--line); background: var(--glass-2); border-radius: 13px; padding: 8px 14px; cursor: pointer; font-size: 14.5px; color: var(--ink); }
.need:hover, .need:focus-visible { border-color: rgba(110,168,254,.55); background: var(--blue-soft); outline: none; }
.facts { display: flex; gap: 30px; margin-top: 28px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.facts b { display: block; font: 700 32px/1 var(--display); color: #fff; }
.facts span { color: var(--muted); font-size: 12.5px; }
.stack { position: relative; height: 470px; }
.stack .card { background: linear-gradient(#171a29, #0b0c14); position: absolute; width: 78%; box-shadow: 0 50px 110px -40px rgba(0,0,0,.9), 0 0 90px -30px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,.1); }
.stack .card:nth-child(1) { top: 0; inset-inline-end: 0; transform: rotate(-2deg); }
.stack .card:nth-child(2) { top: 160px; inset-inline-start: 0; transform: rotate(1.5deg); }
.stack .card:nth-child(3) { top: 310px; inset-inline-end: 6%; transform: rotate(-.5deg); }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.cat { text-align: right; display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; align-items: start; border: 1px solid var(--line); background: var(--glass); border-radius: 14px; padding: 16px; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; color: var(--ink); }
.cat:hover, .cat:focus-visible { border-color: color-mix(in srgb, var(--cc) 60%, transparent); background: rgba(255,255,255,.06); transform: translateY(-2px); outline: none; }
.ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 16%, rgba(255,255,255,.04)); color: var(--cc); grid-row: span 3; }
.cat h3 { font: 600 16.5px/1.3 var(--body); color: #fff; }
.cat p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.cat small { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 300px); gap: 14px; overflow-x: auto; padding: 4px 2px 12px; max-width: 100%; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { position: relative; text-align: right; border: 1px solid var(--line); background: var(--card-bg); border-radius: 18px; padding: 18px 18px 14px; cursor: pointer; display: grid; gap: 10px; align-content: start; min-width: 0; transition: border-color .15s, box-shadow .2s; color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.card::before { content: ""; position: absolute; inset: 0 22px auto 22px; height: 2px; border-radius: 0 0 3px 3px; background: var(--cc); opacity: .9; box-shadow: 0 0 14px var(--cc); }
.card:hover, .card:focus-visible { border-color: rgba(110,168,254,.4); box-shadow: 0 0 90px -30px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,.1); outline: none; }
.card:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.grid, .shelf { align-items: start; }
.card .crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--cc); font-weight: 600; }
.card .crumb .mini { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 16%, rgba(255,255,255,.04)); flex: none; }
.card h3 { font: 600 17px/1.32 var(--body); color: #fff; overflow-wrap: anywhere; }
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.p-ok { background: var(--ok-soft); color: var(--ok); } .p-soon { background: var(--soon-soft); color: var(--soon); } .p-type { background: var(--glass-2); color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
.add { border: 1px solid var(--line); background: var(--glass-2); border-radius: 11px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); }
.add:hover { border-color: rgba(110,168,254,.55); background: var(--blue-soft); }
.add[aria-pressed="true"] { background: var(--btn); color: #fff; border-color: rgba(110,168,254,.5); }
.inds { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.ind { text-align: right; border: 1px solid var(--line); background: var(--glass); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
.ind:hover, .ind:focus-visible { border-color: rgba(110,168,254,.55); background: var(--blue-soft); outline: none; }
.ind small { color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.step { background: var(--card-bg); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; gap: 6px; box-shadow: 0 0 90px -40px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,.1); }
.step b { font: 800 36px/1 var(--display); background: linear-gradient(100deg, var(--blue-2), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.step h3 { font: 600 18px var(--body); color: #fff; }
.step p { margin: 0; color: var(--muted); font-size: 14.5px; }
.shot { margin: -18px -18px 2px; aspect-ratio: 16/10; border-radius: 17px 17px 0 0; overflow: hidden; background: #0b0d16; border-bottom: 1px solid var(--line); }
.shot { position: relative; }
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; filter: brightness(.86) saturate(.92); }
.shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(11,12,20,.8)); pointer-events: none; }
.shot.ph { display: grid; place-items: center; color: var(--cc); background: radial-gradient(120% 90% at 70% 10%, color-mix(in srgb, var(--cc) 22%, #0b0d16), #0b0d16 70%); }
.shot.ph svg { width: 54px; height: 54px; opacity: .85; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--cc) 60%, transparent)); }
.card:has(.shot)::before { z-index: 1; }
.pic { margin: 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #0b0d16; box-shadow: 0 30px 80px -40px rgba(0,0,0,.9), 0 0 70px -30px var(--blue-glow); }
.pic img { filter: brightness(.9); width: 100%; height: auto; display: block; aspect-ratio: 16/10; object-fit: cover; object-position: top center; }
.pic figcaption { font-size: 12.5px; color: var(--faint); padding: 8px 12px; border-top: 1px solid var(--line); }
.feat { position: relative; }
.feat { padding-bottom: 34px; }
.feat .pic { transform: perspective(1400px) rotateY(-7deg) rotateX(3deg); }
.feat .badge { position: absolute; inset-inline-start: -14px; bottom: -22px; width: min(300px, 70%); background: linear-gradient(#171a29, #0b0c14); border: 1px solid var(--line-2); border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.9), 0 0 60px -26px var(--blue-glow); cursor: pointer; text-align: right; color: var(--ink); }
.feat .badge b { font-size: 16px; color: #fff; } .feat .badge span { font-size: 13px; color: var(--muted); }
@media (max-width: 860px) { .hero .feat { display: none; } }
.incl { display: grid; gap: 6px; } .incl h3 { font: 600 15.5px var(--body); margin-top: 4px; color: #fff; }
.incl ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.incl li button { width: 100%; text-align: right; border: 1px solid var(--line); background: var(--glass); border-radius: 12px; padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--ink); }
.incl li button:hover { border-color: rgba(110,168,254,.55); background: var(--blue-soft); }
.faq { display: grid; gap: 6px; } .faq h3 { font: 600 15.5px var(--body); margin-top: 4px; color: #fff; }
.faq details { border: 1px solid var(--line); background: var(--glass); border-radius: 12px; padding: 9px 14px; }
.faq summary { cursor: pointer; font-weight: 600; font-size: 14.5px; } .faq p { margin: 6px 0 2px; color: var(--muted); font-size: 14px; }
.skip:focus { position: static; width: auto; height: auto; clip: auto; padding: 8px 12px; border-radius: 10px; background: var(--btn); color: #fff; grid-column: 1 / -1; justify-self: start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lhead { display: grid; gap: 6px; }
.crumbs { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; }
.lhead h1 { font: 700 clamp(28px, 4.4vw, 44px)/1.1 var(--display); color: #fff; text-wrap: balance; }
.lhead p { margin: 0; color: var(--muted); }
.layout { display: grid; grid-template-columns: 260px 1fr; gap: 26px; align-items: start; }
.layout > * { min-width: 0; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); max-height: calc(100vh - 140px); overflow-y: auto; display: grid; gap: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card-bg); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side { display: none; } }
.fgroup { display: grid; gap: 3px; }
.fgroup h4 { margin: 0 0 3px; font-size: 11.5px; color: var(--faint); font-weight: 500; letter-spacing: .12em; }
.opt { display: flex; justify-content: space-between; gap: 8px; text-align: right; border: 0; background: none; padding: 5px 9px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--ink); }
.opt:hover { background: var(--glass-2); }
.opt[aria-pressed="true"] { background: linear-gradient(rgba(110,168,254,.32), rgba(110,168,254,.18)); color: #fff; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.opt small { color: var(--faint); font-variant-numeric: tabular-nums; }
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.active { display: flex; gap: 6px; flex-wrap: wrap; }
.chipx { border: 1px solid rgba(110,168,254,.4); background: var(--blue-soft); color: #fff; border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chipx::after { content: " ×"; opacity: .7; }
.fbtn { display: none; border: 1px solid var(--line); background: var(--glass-2); border-radius: 11px; padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--ink); }
@media (max-width: 900px) { .fbtn { display: inline-flex; } }
.count { color: var(--muted); font-size: 13.5px; }
.leafs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding: 4px; border: 1px solid var(--line); background: rgba(255,255,255,.043); border-radius: 13px; }
.leafs button { flex: none; border: 0; background: none; border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; white-space: nowrap; color: rgba(255,255,255,.66); font-weight: 600; }
.leafs button[aria-pressed="true"] { background: linear-gradient(rgba(110,168,254,.32), rgba(110,168,254,.18)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
.more { display: block; margin: 24px auto 0; border: 1px solid var(--line); background: var(--glass-2); border-radius: 13px; padding: 10px 22px; cursor: pointer; font-weight: 600; color: var(--ink); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.scrim { position: fixed; inset: 0; background: rgba(4,6,12,.66); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 40; }
.sheet { position: fixed; z-index: 41; inset: 0 0 0 auto; width: min(540px, 100%); background: linear-gradient(rgba(22,24,38,.97), rgba(11,12,20,.99)); border-inline-start: 1px solid var(--line); box-shadow: 0 0 120px -30px var(--blue-glow); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) max(22px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(22px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; align-content: start; color: var(--ink); }
.sheet { grid-auto-rows: max-content; }
.fsheet > .btn { position: sticky; bottom: calc(-28px - env(safe-area-inset-bottom, 0px)); margin: 0 -22px -28px; border-radius: 0; box-shadow: 0 -14px 28px rgba(7,10,18,.95); }
.fsheet .shead { position: sticky; top: -18px; background: rgb(20,22,35); z-index: 2; padding-block: 6px; }
.sheet.fsheet { inset: auto 0 0 0; width: 100%; max-height: 85vh; border-radius: 26px 26px 0 0; border-inline-start: 0; border-top: 1px solid var(--line); }
.shead { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.close { border: 1px solid var(--line); background: var(--glass-2); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; flex: none; font-size: 20px; line-height: 1; color: var(--ink); }
.sheet h2 { font-size: clamp(24px, 3vw, 30px); color: #fff; }
.sheet .lead { margin: 0; font-size: 17px; line-height: 1.6; color: rgba(238,241,251,.86); }
.big { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 18%, rgba(255,255,255,.04)); color: var(--cc); border: 1px solid color-mix(in srgb, var(--cc) 35%, transparent); }
.facts2 { display: grid; gap: 8px; border: 1px solid var(--line); background: var(--glass); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
.facts2 div { display: flex; justify-content: space-between; gap: 12px; }
