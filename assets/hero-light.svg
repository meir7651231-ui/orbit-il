<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="אורביט · orbit-il.com — הריפו שבונה ומגיש את האתר החי / the repo that builds and serves the live site">
<defs>
<radialGradient id="bg" cx="72%" cy="46%" r="75%"><stop offset="0" stop-color="#e8ecfb"/><stop offset=".55" stop-color="#f6f3ee"/><stop offset="1" stop-color="#faf7f2"/></radialGradient>
<radialGradient id="glass" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".5" stop-color="#9fb4ff" stop-opacity=".07"/><stop offset="1" stop-color="#0d1120" stop-opacity=".55"/></radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fd4a4"/><stop offset=".55" stop-color="#4f7dff"/><stop offset="1" stop-color="#7b6bff"/></linearGradient>
<linearGradient id="net" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fe0b0"/><stop offset="1" stop-color="#8a7dff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="ball"><circle cx="960" cy="240" r="150"/></clipPath>
</defs>
<style>
.spin{transform-origin:960px 240px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 3s ease-in-out infinite}.tw2{animation:tw 3s ease-in-out 1.5s infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.dash{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1280" height="480" rx="24" fill="url(#bg)"/>
<g fill="#9aa6c6"><circle cx="120" cy="70" r="1.4" class="tw"/><circle cx="300" cy="420" r="1.2" class="tw2"/><circle cx="560" cy="60" r="1.6" class="tw"/><circle cx="1210" cy="90" r="1.3" class="tw2"/><circle cx="1180" cy="410" r="1.5" class="tw"/><circle cx="700" cy="440" r="1.1" class="tw2"/><circle cx="760" cy="40" r="1.2" class="tw"/></g>

<!-- back half of orbit ring -->
<ellipse cx="960" cy="240" rx="250" ry="70" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".35" transform="rotate(-14 960 240)"/>
<!-- sphere -->
<circle cx="960" cy="240" r="150" fill="#10162c"/>
<g clip-path="url(#ball)" stroke="url(#net)" stroke-width="1.3" fill="none" opacity=".85">
<g class="spin">
<path d="M840 170 L900 140 L975 160 L1040 130 L1085 190 M900 140 L930 220 L975 160 L1010 230 L1040 130 M840 170 L870 250 L930 220 L1010 230 L1080 270 L1085 190 M870 250 L900 320 L960 300 L1010 230 M960 300 L1030 330 L1080 270 M900 320 L960 370 L1030 330 M930 220 L960 300"/>
</g>
</g>
<g clip-path="url(#ball)" fill="#bfe9ff" filter="url(#glow)">
<g class="spin"><circle cx="900" cy="140" r="3"/><circle cx="975" cy="160" r="3"/><circle cx="1040" cy="130" r="3"/><circle cx="930" cy="220" r="3.5"/><circle cx="1010" cy="230" r="3.5"/><circle cx="870" cy="250" r="3"/><circle cx="1080" cy="270" r="3"/><circle cx="960" cy="300" r="3.5"/><circle cx="900" cy="320" r="3"/><circle cx="1030" cy="330" r="3"/><circle cx="840" cy="170" r="2.5"/><circle cx="1085" cy="190" r="2.5"/><circle cx="960" cy="370" r="2.5"/></g>
</g>
<path d="M915 255 Q960 290 1005 255" fill="none" stroke="#ffe9b0" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
<circle cx="960" cy="240" r="150" fill="url(#glass)" stroke="#c9d6ff" stroke-opacity=".35" stroke-width="2"/>
<!-- front half of orbit ring -->
<path d="M710 240 A250 70 0 0 0 1210 240" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" transform="rotate(-14 960 240)"/>

<!-- text (RTL) -->
<g font-family="'Heebo','Assistant','Segoe UI',Arial,sans-serif" text-anchor="end">
<text x="640" y="150" fill="#0f9f78" font-size="20" font-weight="700" letter-spacing="2" direction="ltr">ORBIT-IL · DEPLOY</text>
<text x="640" y="225" fill="#16213e" font-size="76" font-weight="800">אורביט</text>
<text x="640" y="275" fill="#34405e" font-size="28" font-weight="600">הריפו שבונה ומגיש את האתר החי</text>
<text x="640" y="312" fill="#5b6684" font-size="20" direction="ltr">builds maor-system → serves orbit-il.com</text>
</g>
<g font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="17">
<rect x="250" y="350" width="390" height="46" rx="12" fill="#16213e" stroke="#16213e"/>
<text x="268" y="379" fill="#2fd4a4" direction="ltr">$</text>
<text x="290" y="379" fill="#dfe6ff" direction="ltr">curl orbit-il.com/version.json</text>
</g>
</svg>
